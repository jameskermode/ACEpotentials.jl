# Environment for the KA-on-CUDA tests (ka_one.jl / ka_cuda.jl / ladder.sh).
# Deliberately minimal: CUDA must be present for Reactant's KA bridge to exist
# at all -- `ka_with_reactant` is defined only inside ReactantCUDAExt.
# Copy to Project.toml in a fresh directory and `Pkg.instantiate()`.
[deps]
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Reactant = "3c362404-f566-11ee-1572-e11a4b42c853"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
