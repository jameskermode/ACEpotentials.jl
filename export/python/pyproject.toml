[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-iree"
version = "0.1.0"
description = "ASE Calculator for IREE-compiled ACE potentials"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ACEsuit developers", email = "ace@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["atomistic", "simulation", "machine-learning", "interatomic-potential", "ACE"]

dependencies = [
    "numpy>=1.21",
    "ase>=3.22",
    "matscipy>=0.8",
]

[project.optional-dependencies]
iree = [
    "iree-base-runtime==3.10.0rc20260106",
    "iree-base-compiler==3.10.0rc20260106",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.urls]
"Homepage" = "https://github.com/ACEsuit/ACEpotentials.jl"
"Documentation" = "https://acesuit.github.io/ACEpotentials.jl"
"Repository" = "https://github.com/ACEsuit/ACEpotentials.jl"

[tool.uv]
find-links = ["https://iree.dev/pip-release-links.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.npz", "*.json", "*.vmfb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
