# Portable ACE Potential Package
# ===============================
#
# This is a portable Python package containing pre-compiled IREE models
# for ACE potentials. It provides an ASE Calculator interface.
#
# Installation:
#   pip install -e .
#
# Usage:
#   from mypotential import Calculator
#   calc = Calculator()
#   atoms.calc = calc
#   energy = atoms.get_potential_energy()

[project]
name = "mypotential"
version = "0.1.0"
description = "IREE-compiled ACE potential for ASE"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "ase>=3.22",
    "matscipy>=0.8",
    "iree-base-runtime>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mypotential"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "README.md",
]
