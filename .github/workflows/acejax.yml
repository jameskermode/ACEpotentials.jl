name: acejax

# The Python evaluator in acejax/.  Independent of the Julia CI.
# src/** and Project.toml are here deliberately: the divergence job below exists
# to catch the Julia fitter and the Python evaluator drifting apart, and it can
# only do that if a change to the Julia model actually triggers this workflow.
on:
  push:
    paths: ['acejax/**', 'src/**', 'Project.toml', '.github/workflows/acejax.yml']
  pull_request:
    paths: ['acejax/**', 'src/**', 'Project.toml', '.github/workflows/acejax.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: acejax

jobs:
  # The real gate: 62 tests, CPU, both model families, on every push.
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: acejax/uv.lock
      - name: Sync
        run: uv sync --group dev --python ${{ matrix.python }}
      - name: Test
        run: uv run pytest tests/ -q -rs
      # matscipy (the dependency) covers the sparse and dense paths, so the run
      # above skips only the sphericart harmonic checks.  matscipy-neighbours is
      # not on PyPI and needs a C++/CMake build; install it once on the newest
      # Python so the three-backend equivalence check exercises all three.
      - name: Test with matscipy-neighbours as well
        if: matrix.python == '3.13'
        run: |
          uv pip install "matscipy-neighbours @ git+https://github.com/libAtoms/matscipy-neighbours"
          uv run pytest tests/ -q

  # THE CROSS-LANGUAGE GUARD.  The `tests` job above compares acejax against
  # reference values baked into the COMMITTED fixtures, which Julia wrote once
  # when they were generated -- so it proves acejax still agrees with a snapshot
  # of Julia, not with the Julia in this tree.  A convention change in
  # src/models/ would leave those fixtures untouched and the job green while the
  # two silently diverged.
  #
  # This job regenerates the exports from the working tree (note the
  # Pkg.develop: without it the exporter would resolve ACEpotentials from the
  # registry and test the released version, not this one) and re-runs the same
  # suite against them, so every reference value is fresh.
  # The matrix matters as much as the regeneration.  Matching at one basis proves
  # little: a convention can be right for one species and wrong for two, or right
  # at correlation order 3 and wrong at 4.  Each entry exports BOTH model families
  # at its parameters, so the splined/spherical and analytic/solid branches are
  # both covered at every point.  All but the first skip the fit (ACE_NOFIT=1) --
  # the guard tests conventions, not fit quality, and a fit to Si_tiny would be
  # meaningless for a Si-C model anyway.
  divergence:
    name: julia vs python (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fitted Si order 3
            elements: Si
            order: '3'
            totaldegree: '10'
            maxl: '6'
            nofit: '0'
          - name: Si-C order 3
            elements: Si,C
            order: '3'
            totaldegree: '8'
            maxl: '6'
            nofit: '1'
          - name: Si order 4
            elements: Si
            order: '4'
            totaldegree: '8'
            maxl: '4'
            nofit: '1'
          - name: Si-C order 4
            elements: Si,C
            order: '4'
            totaldegree: '8'
            maxl: '4'
            nofit: '1'
          # Three species: two can hide a convention that is really "centre vs
          # other" rather than a genuine per-pair lookup, and this is also the
          # precursor to the embedding work (see "Long-term directions" in the
          # plan).  Note the O(S^nu) blowup it exercises: at order 3 / degree 8
          # the ace1 basis goes 648 -> 2823 per site from two species to three.
          - name: Si-C-O order 3
            elements: Si,C,O
            order: '3'
            totaldegree: '8'
            maxl: '4'
            nofit: '1'
          # Frozen-element-embedding models export through the ORDINARY splined
          # path -- the embedding is baked into the radial splines, so acejax
          # needs no knowledge of it.  This row is what keeps that true.
          - name: Ti-Al embedding
            elements: Ti,Al
            order: '3'
            totaldegree: '6'
            maxl: '4'
            nofit: '1'
            kind: embedding
    env:
      ACE_ELEMENTS: ${{ matrix.elements }}
      ACE_ORDER: ${{ matrix.order }}
      ACE_TOTALDEGREE: ${{ matrix.totaldegree }}
      ACE_MAXL: ${{ matrix.maxl }}
      ACE_NOFIT: ${{ matrix.nofit }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: actions/cache@v4
        with:
          path: ~/.julia
          key: ${{ runner.os }}-julia-1.11-${{ hashFiles('Project.toml', 'acejax/julia/Project.toml') }}
          restore-keys: ${{ runner.os }}-julia-1.11-
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: acejax/uv.lock
      - name: Instantiate the exporter against the working tree
        working-directory: .
        run: |
          julia -e 'using Pkg; Pkg.Registry.add(RegistrySpec(url="https://github.com/ACEsuit/ACEregistry"))'
          julia --project=acejax/julia -e '
            using Pkg
            Pkg.develop(path=".")     # the ACEpotentials under test, not the registry one
            Pkg.instantiate()
            Pkg.status()'
      - name: Extract the frozen element embedding
        if: matrix.kind == 'embedding'
        working-directory: .
        run: |
          uv run --with torch --with numpy python scripts/extract_mace_embedding.py \
            -o fresh_embedding.npz
          ls -l fresh_embedding.json
      - name: Regenerate both fixtures from Julia
        working-directory: .
        env:
          # the embedding rows for this row's elements; ignored by the other rows
          ACE_EMBEDDING: ${{ github.workspace }}/fresh_embedding.json
        run: |
          mkdir -p fresh
          KIND1=${{ matrix.kind || 'ace1' }}
          KIND2=${{ matrix.kind || 'ace' }}
          julia --project=acejax/julia acejax/julia/export_model.jl fresh/si_fitted.npz $KIND1
          julia --project=acejax/julia acejax/julia/export_model.jl fresh/si_ace_model.npz $KIND2
          ls -l fresh/
      - name: Run the suite against the fresh exports
        env:
          # absolute, since the suite runs with acejax/ as the working directory
          ACEJAX_FIXTURE_DIR: ${{ github.workspace }}/fresh
          # missing fixtures must fail, not skip -- a failed regeneration would
          # otherwise produce a green run with everything skipped
          ACEJAX_REQUIRE_FIXTURES: '1'
        run: |
          uv sync --group dev
          uv run pytest tests/ -q -rs

  # Verifies the package builds and installs clean, and that the README example
  # runs from the installed wheel rather than the source tree.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build wheel and sdist
        run: uv build
      - name: Install into a clean env and run the README example
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl ase
          /tmp/clean/bin/python - <<'PY'
          import jax; jax.config.update("jax_enable_x64", True)
          from ase.build import bulk
          from acejax import ACECalculator
          atoms = bulk("Si", cubic=True) * 2
          atoms.calc = ACECalculator("fixtures/si_fitted.npz")
          print("E =", atoms.get_potential_energy())
          print("descriptors", atoms.calc.get_site_descriptors(atoms).shape)
          PY

  # Catches LAMMPS build breakage.  Caches keyed on the upstream stable commit
  # so it rebuilds only when LAMMPS moves, following kermodegroup/ML-MIX.
  # This builds the plugin; it does NOT run it -- see the note below.
  lammps-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve LAMMPS stable commit
        run: |
          echo "LAMMPS_VERSION=$(git ls-remote https://github.com/lammps/lammps.git refs/heads/stable | awk '{print $1}')" >> $GITHUB_ENV
      - name: Restore LAMMPS source cache
        id: lammps-src-cache
        uses: actions/cache/restore@v4
        with:
          path: lammps
          key: ${{ runner.os }}-lammps-src-${{ env.LAMMPS_VERSION }}
      - name: Restore LAMMPS install cache
        id: lammps-install-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/lammps-install
          key: ${{ runner.os }}-lammps-install-${{ env.LAMMPS_VERSION }}
      - name: Clone LAMMPS
        if: steps.lammps-src-cache.outputs.cache-hit != 'true'
        # Must run at the workspace root, not the acejax/ default: the cache
        # paths are workspace-relative and the repo already has acejax/lammps/
        # (our export tooling), which git clone refuses to write into.
        working-directory: .
        run: git clone --depth 1 -b stable https://github.com/lammps/lammps.git lammps
      - name: Build LAMMPS
        if: steps.lammps-install-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          sudo apt-get update && sudo apt-get install -y cmake build-essential libopenmpi-dev
          cmake -S lammps/cmake -B build -D CMAKE_BUILD_TYPE=Release \
                -D BUILD_MPI=on -D PKG_MANYBODY=on -D PKG_PLUGIN=on \
                -D CMAKE_INSTALL_PREFIX=$PWD/.cache/lammps-install
          cmake --build build -j $(nproc) --target install
      - name: Save caches
        if: steps.lammps-install-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/lammps-install
          key: ${{ runner.os }}-lammps-install-${{ env.LAMMPS_VERSION }}

  # NOT RUN IN CI, AND DELIBERATELY SO.
  #
  # `pair_style jax/kk` is CUDA-only: it executes through the CUDA PJRT plugin
  # and has no CPU path.  GitHub-hosted runners have no GPU, so this gate cannot
  # run here.  A CPU stand-in would be a green tick proving nothing, which is
  # worse than an honest manual step.
  #
  # To run it, on a machine with an NVIDIA GPU and a matching LAMMPS build:
  #
  #     cd acejax/lammps
  #     python export_bundle.py --npz ../fixtures/si_fitted.npz --out si.lammps-jax.json
  #     ./test_si_bundle.sh
  #
  # Enable it here by adding a self-hosted runner labelled `gpu` and a job with
  # `runs-on: [self-hosted, gpu]` calling that script.  Last verified results are
  # committed under acejax/lammps/run_artifacts/.
